name: Build desktop artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content src-tauri/tauri.conf.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = "[^"]*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Tauri app
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      # To enable signing: add PFX_BASE64 (base64-encoded .pfx) and PFX_PASSWORD to repo secrets.
      - name: Sign Windows binary (optional)
        if: env.PFX_BASE64 != ''
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.Convert]::FromBase64String($env:PFX_BASE64) | Set-Content $pfxPath -AsByteStream
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          $exe = Get-ChildItem "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($exe) {
            & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe.FullName
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-windows-x86_64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target aarch64-apple-darwin

      - name: Build Tauri app
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Build Tauri app
        run: npm run tauri:build -- --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-linux-x86_64
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-android:
    name: Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Initialize Tauri Android project
        run: npm run tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Build APK (debug)
        run: npm run tauri android build -- --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-android-aarch64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v' | sed -n '2p')

          {
            echo "## What's changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|---|---|"
            find artifacts -type f -name "*.exe" -o -type f -name "*.dmg" -o -type f -name "*.AppImage" -o -type f -name "*.apk" | sort | while read f; do
              name=$(basename "$f")
              case "$name" in
                *.exe)       platform="Windows x86_64 (portable installer)" ;;
                *.dmg)       platform="macOS ARM64" ;;
                *.AppImage)  platform="Linux x86_64" ;;
                *.apk)       platform="Android ARM64" ;;
              esac
              echo "| $platform | \`$name\` |"
            done
            echo ""
            echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            echo ""
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "> **Note:** the app is not code-signed. Follow the platform-specific steps below to bypass the security warning."
            echo ""
            echo "### Windows"
            echo ""
            echo "1. Download the \`.exe\` file."
            echo "2. Double-click it to run — no installation required, it is a portable installer."
            echo "3. If **Windows Defender SmartScreen** shows _\"Windows protected your PC\"_:"
            echo "   - Click **More info**."
            echo "   - Click **Run anyway**."
            echo ""
            echo "### macOS"
            echo ""
            echo "1. Download the \`.dmg\` file and open it."
            echo "2. Drag **Mock VPN Client** to the **Applications** folder."
            echo "3. On first launch macOS will block the app with _\"cannot be opened because it is from an unidentified developer\"_:"
            echo "   - Open **System Settings → Privacy & Security**."
            echo "   - Scroll down to the **Security** section — you will see a message about the blocked app."
            echo "   - Click **Open Anyway**."
            echo "   - In the confirmation dialog click **Open**."
            echo ""
            echo "### Linux"
            echo ""
            echo "1. Download the \`.AppImage\` file."
            echo "2. Make it executable and run:"
            echo '   ```bash'
            echo '   chmod +x Mock-VPN-Client_*.AppImage'
            echo '   ./Mock-VPN-Client_*.AppImage'
            echo '   ```'
            echo ""
            echo "### Android"
            echo ""
            echo "1. Download the \`.apk\` file to your device."
            echo "2. Open the file — Android will warn _\"Install unknown apps\"_:"
            echo "   - Tap **Settings** and enable **Allow from this source**."
            echo "   - Go back and tap **Install**."
            echo "3. If Play Protect shows a warning, tap **Install anyway**."
          } > release_notes.md

          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: artifacts/**/*
          fail_on_unmatched_files: false

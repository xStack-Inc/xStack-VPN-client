name: Build desktop artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vpn-client-windows-x86_64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: vpn-client-macos-arm64
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: vpn-client-linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}

      # To enable signing: add PFX_BASE64 (base64-encoded .pfx) and PFX_PASSWORD to repo secrets.
      # Without these secrets the step is skipped and the binary ships unsigned.
      - name: Sign Windows binary (optional)
        if: runner.os == 'Windows' && env.PFX_BASE64 != ''
        env:
          PFX_BASE64: ${{ secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.Convert]::FromBase64String($env:PFX_BASE64) | Set-Content $pfxPath -AsByteStream
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          Write-Host "signtool: $signtool"
          $exe = Get-ChildItem "src-tauri\target\${{ matrix.target }}\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($exe) {
            & $signtool sign /f $pfxPath /p $env:PFX_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $exe.FullName
            Write-Host "Signed: $($exe.FullName)"
          }

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

[package]
name = "mock-vpn-client"
version = "0.1.0"
description = "Cross-platform mock VPN client built with Tauri 2"
authors = ["VPN Client MVP"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
